<!DOCTYPE html>
<!-- Versiegeschiedenis:
v1.000 (07-07-2026): Baseline voor versietracking — dubbelklik-op-selecteer-alles override verwijderd; quoteTotalInput na indienen offerte readonly i.p.v. disabled zodat tekst selecteerbaar blijft
v1.100 (08-07-2026): Flow #1 (Escrow & Milestones), #2 (Warranty & Holdback), #3 (Profiel Rookie Stage & Reviews), #4 (Technische Intake vragenbibliotheek) toegevoegd aan Contractdetail/Profiel/Negotiation Workspace — zie GoodCompany_ClaudeCode_Implementatieopdracht_Showmodel.md
v1.200 (09-07-2026): Reviewronde — .tab-stijl herzien naar kaartjes-vormgeving; alert() in reviewformulier vervangen door inline foutmelding; Change Order-vervaltermijn zichtbaar gemaakt. Community Bank-leningaanvraag alsnog volledig gebouwd (4-staps flow: aanvraag/onderbouwing/steekproef & stemmen/uitkomst). Walkthrough-pagina toegevoegd aan sidebar.
v1.210 (09-07-2026): Bugfix — stemsimulatie Community Bank capte op audience (300) i.p.v. required (100); simulatieknop verdwijnt nu zodra benodigde stemmen bereikt zijn.
v1.300 (09-07-2026): Flow A — AVI-onboarding (gesimuleerd, drietraps-bootstrap + segmentmodel) toegevoegd, bereikbaar vanuit Profiel. Flow B — Payment/Bank Coupling toegevoegd (koppel-flow, step-up herauthenticatie + asynchrone providerbevestiging, geïntegreerd in mijlpaal-goedkeuring). Walkthrough-pagina bijgewerkt met beide nieuwe onderdelen.
v1.400 (09-07-2026): Change Order Conversation-structuur (motivatie/acceptatie met optionele toelichting/afwijzing met verplichte reden) + intrekking via wederzijdse instemming (twee-staps simulatie). Prefer/Avoid-markering toegevoegd aan Contacts. Community Bank reserve-bedragen naast percentages op Dashboard en Community Bank-pagina. Walkthrough-pagina bijgewerkt met alle vier toevoegingen.
-->
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoodCompany — MVP 1 Showmodel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#5CBDC7; --teal-dark:#3E9BA5; --teal-tint:#EAF6F7;
    --orange:#F39221; --orange-tint:#FDEBD3;
    --ink:#1B2426; --slate:#64748B; --slate-light:#9AA6B2;
    --bg:#F4F6F6; --surface:#FFFFFF; --border:#E7ECED;
    --success:#1F8A4C; --success-tint:#E5F5EA;
    --danger:#D9534F; --danger-tint:#FCEAEA;
    --info:#3E7BD9; --info-tint:#E9F0FC;
    --sidebar-w:236px;
  }
  *{box-sizing:border-box;}
  input, textarea{user-select:text;-webkit-user-select:text;}
  body{margin:0;font-family:Arial, Helvetica, sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
  h1,h2,h3,.brand,.navlabel,.card-title,.pill,button,.stat-frac{font-family:'Montserrat',Arial,sans-serif;}
  a{color:inherit;text-decoration:none;}
  button{cursor:pointer;font-family:'Montserrat',Arial,sans-serif;}
  

  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar: light, icon+label, subtle active indicator ---------- */
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
    padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;}
  .brand .txt span{display:block;font-weight:800;font-size:15px;letter-spacing:-0.01em;color:var(--ink);}
  .brand .txt small{display:block;color:var(--slate);font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;}

  .navgroup-title{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--slate-light);margin:18px 10px 6px;font-weight:700;}
  .navitem{
    display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;margin-bottom:1px;
    color:#3A4750;font-size:13px;font-weight:600;border:none;background:none;width:100%;text-align:left;
    border-left:3px solid transparent;
  }
  .navitem:hover{background:#F2F8F8;}
  .navitem.active{background:var(--teal-tint);color:var(--teal-dark);border-left-color:var(--teal);}
  .navitem .ic{width:18px;text-align:center;font-size:14px;color:var(--slate-light);}
  .navitem.active .ic{color:var(--teal-dark);}
  .navitem.disabled{color:var(--slate-light);cursor:default;}
  .navitem.disabled:hover{background:none;}
  .soon-tag{margin-left:auto;font-size:9px;background:var(--orange-tint);color:#A8590C;padding:2px 6px;border-radius:20px;letter-spacing:.04em;font-weight:700;}

  .main{flex:1;min-width:0;}

  /* ---------- Topbar: search + quick actions, Perfex-style ---------- */
  .topbar{
    display:flex;align-items:center;gap:18px;padding:14px 28px;
    background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;
  }
  .searchbar{
    flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);
    border:1px solid var(--border);border-radius:9px;padding:8px 14px;color:var(--slate);font-size:13px;
  }
  .searchbar .ic{color:var(--slate-light);}
  .quickadd{
    width:34px;height:34px;border-radius:9px;background:var(--orange);color:#fff;border:none;
    font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .quickadd:hover{background:#DA7F14;}
  .topbar-spacer{flex:1;}
  .icon-btn{position:relative;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--slate);font-size:14px;}
  .icon-btn:hover{background:var(--bg);}
  .icon-btn .count{
    position:absolute;top:-6px;right:-6px;background:var(--orange);color:#fff;font-size:9px;font-weight:800;
    min-width:16px;height:16px;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:0 3px;
  }
  .badge-sim{background:var(--orange-tint);color:#A8590C;font-size:10.5px;font-weight:700;padding:5px 11px;border-radius:20px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .badge-sim::before{content:"●";color:var(--orange);font-size:7px;}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
  .page-heading{padding:20px 28px 4px;}
  .page-heading h1{font-size:19px;margin:0;font-weight:700;}
  .page-heading .sub{font-size:12.5px;color:var(--slate);margin-top:2px;}

  .content{padding:8px 28px 60px;max-width:1240px;}

  /* ---------- Cards ---------- */
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:1.4fr 1fr;}
  .grid-2b{grid-template-columns:1fr 1fr;}
  @media (max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:1fr;}.grid-2,.grid-2b{grid-template-columns:1fr;}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:0 1px 2px rgba(20,30,32,0.03);}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .card-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .card-title .ic{color:var(--teal-dark);font-size:14px;}
  .drag{color:var(--slate-light);font-size:12px;letter-spacing:1px;cursor:grab;user-select:none;}
  .card-link{font-size:11.5px;font-weight:700;color:var(--teal-dark);}

  /* KPI strip (Perfex-style: title+fraction, thin bar underneath) */
  .kpi{border-top:none;}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .kpi-top .lbl{font-size:12.5px;font-weight:700;color:#3A4750;display:flex;align-items:center;gap:8px;}
  .kpi-top .lbl .ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
  .kpi-frac{font-size:13px;font-weight:800;color:var(--ink);}
  .thinbar{background:#EEF1F1;border-radius:20px;height:6px;overflow:hidden;}
  .thinbar > div{height:100%;border-radius:20px;}

  /* Overview rows: label ... % right, bar below (Invoice/Estimate/Proposal style) */
  .ov-row{margin-bottom:13px;}
  .ov-row:last-child{margin-bottom:0;}
  .ov-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:5px;}
  .ov-top .lbl{color:#3A4750;}
  .ov-top .val{color:var(--slate);font-weight:600;}

  /* Data table with colored left border rows, Perfex-style */
  .dtable .drow{
    display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border-left:4px solid var(--border);
    background:var(--surface);border-bottom:1px solid var(--border);
  }
  .dtable .drow:last-child{border-bottom:none;}
  .dtable .drow.sev-open{border-left-color:var(--success);}
  .dtable .drow.sev-dormant{border-left-color:var(--slate-light);}
  .dtable .drow.sev-closed{border-left-color:var(--border);}
  .dtable .drow.sev-active{border-left-color:var(--teal);}
  .dtable .drow.sev-completed{border-left-color:var(--success);}
  .dtable .drow.sev-frozen{border-left-color:var(--danger);}
  .drow .dr-main{flex:1;min-width:0;}
  .drow .dr-title{font-weight:700;font-size:13px;}
  .drow .dr-sub{font-size:11.5px;color:var(--slate);margin-top:2px;}
  .drow .dr-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.02em;white-space:nowrap;}
  .pill.open{background:var(--success-tint);color:var(--success);}
  .pill.dormant{background:#EEF1F1;color:var(--slate);}
  .pill.closed{background:#EEF1F1;color:var(--slate-light);}
  .pill.active{background:var(--teal-tint);color:var(--teal-dark);}
  .pill.completed{background:var(--success-tint);color:var(--success);}
  .pill.funded, .pill.verified{background:var(--teal-tint);color:var(--teal-dark);}
  .pill.pending{background:var(--orange-tint);color:#A8590C;}
  .pill.frozen{background:var(--danger-tint);color:var(--danger);}
  .pill.linked{background:var(--teal-tint);color:var(--teal-dark);}
  .pill.unlinked{background:#EEF1F1;color:var(--slate-light);}
  .pill.submitted{background:var(--info-tint);color:var(--info);}
  .pill.rejected{background:var(--danger-tint);color:var(--danger);}
  .pill.paid{background:var(--success-tint);color:var(--success);}
  .pill.proposed{background:var(--orange-tint);color:#A8590C;}
  .pill.accepted{background:var(--success-tint);color:var(--success);}
  .pill.withdrawn{background:#EEF1F1;color:var(--slate);}

  /* ---------- Milestone / Change Order cards (Flow #1) ---------- */
  .milestone-card{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:var(--surface);}
  .milestone-card.st-rejected{border-color:var(--danger);background:var(--danger-tint);}
  .milestone-card.st-paid{border-color:var(--success);background:var(--success-tint);}
  .milestone-head{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .milestone-title{font-weight:700;font-size:13px;}
  .milestone-sub{font-size:11.5px;color:var(--slate);margin-top:2px;}
  .fee-note{font-size:11px;color:var(--slate);margin-top:6px;}
  .field-error{font-size:11px;color:var(--danger);margin-top:6px;font-weight:600;}
  .reject-box{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}

  /* ---------- Holdback timeline (Flow #2) ---------- */
  .hb-timeline{display:flex;align-items:flex-start;gap:0;margin:18px 0 8px;overflow-x:auto;}
  .hb-step{flex:1;min-width:120px;text-align:center;position:relative;padding-top:18px;}
  .hb-step::before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:var(--border);}
  .hb-step:first-child::before{left:50%;}
  .hb-step:last-child::before{right:50%;}
  .hb-dot{position:absolute;top:0;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:var(--border);border:2px solid var(--surface);}
  .hb-step.done .hb-dot{background:var(--success);}
  .hb-step.frozen .hb-dot{background:var(--danger);}
  .hb-step.current .hb-dot{background:var(--orange);}
  .hb-lbl{font-size:11px;font-weight:700;color:var(--ink);margin-top:2px;}
  .hb-amt{font-size:12px;font-weight:700;color:var(--slate);}
  .hb-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .hb-status.done{color:var(--success);}
  .hb-status.frozen{color:var(--danger);}
  .hb-status.pending{color:var(--slate-light);}

  .warranty-badge{border:1px solid var(--border);border-radius:10px;padding:12px 16px;background:var(--teal-tint);font-size:12px;color:var(--teal-dark);font-weight:700;display:flex;gap:18px;flex-wrap:wrap;}
  .warranty-badge .wb-item span{display:block;font-size:10px;font-weight:600;color:var(--slate);text-transform:none;margin-top:2px;}
  .priority{font-size:11.5px;font-weight:700;}
  .priority.high{color:var(--danger);}
  .priority.medium{color:var(--info);}
  .priority.low{color:var(--slate);}

  /* Donut chart via conic-gradient */
  .donut-wrap{display:flex;align-items:center;gap:22px;}
  .donut{width:126px;height:126px;border-radius:50%;flex-shrink:0;position:relative;}
  .donut::after{content:"";position:absolute;inset:20px;background:var(--surface);border-radius:50%;}
  .legend{display:flex;flex-direction:column;gap:8px;}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#3A4750;font-weight:600;}
  .legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}

  /* Bar chart */
  .barchart{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:6px;}
  .barchart .bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .barchart .bar{width:60%;border-radius:6px 6px 0 0;}
  .barchart .bcol span{font-size:10.5px;color:var(--slate);font-weight:600;}

  /* Stage tracker — signature element mirroring the build spec state machines */
  .stage-tracker{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:14px 0 6px;}
  .stage{display:flex;align-items:center;}
  .stage .node{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:20px;font-size:11.5px;font-weight:700;background:#EEF1F1;color:var(--slate-light);white-space:nowrap;}
  .stage .node.done{background:var(--teal-tint);color:var(--teal-dark);}
  .stage .node.current{background:var(--teal);color:#0E2224;}
  .stage-connector{width:20px;height:2px;background:var(--border);margin:0 2px;}

  .btn{background:var(--teal);color:#0E2224;border:none;padding:9px 16px;border-radius:8px;font-weight:700;font-size:12.5px;}
  .btn:hover{background:var(--teal-dark);color:#fff;}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--ink);}
  .btn.ghost:hover{background:var(--teal-tint);border-color:var(--teal);}
  .btn:focus-visible, .navitem:focus-visible, .icon-btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}

  .mini-stat{border-left:4px solid var(--border);padding:12px 16px;border-radius:8px;background:var(--surface);border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
  .mini-stat.c-orange{border-left-color:var(--orange);}
  .mini-stat.c-slate{border-left-color:var(--slate-light);}
  .mini-stat.c-teal{border-left-color:var(--teal);}
  .mini-stat .m-lbl{font-size:11.5px;color:var(--slate);font-weight:600;}
  .mini-stat .m-val{font-size:19px;font-weight:800;margin-top:4px;}

  .tabs{display:flex;gap:8px;border-bottom:none;margin-bottom:16px;overflow-x:auto;}
  .tab{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;color:var(--slate);white-space:nowrap;box-shadow:0 1px 2px rgba(20,30,32,0.03);}
  .tab:hover{background:var(--teal-tint);border-color:var(--teal);}
  .tab.active{color:var(--teal-dark);border-color:var(--teal);background:var(--teal-tint);}

  .accordion-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:0;color:var(--slate);font-size:14px;}
  .filter-select{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink);background:var(--surface);font-family:Arial,sans-serif;}
  .btn-sm{padding:6px 12px;font-size:11.5px;border-radius:7px;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,30,32,0.42);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--surface);border-radius:14px;width:440px;max-width:92vw;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,0.2);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-close{background:none;border:none;color:var(--slate);font-size:15px;}
  .modal-body{display:flex;flex-direction:column;gap:4px;}
  .field-label{font-size:11.5px;font-weight:700;color:var(--slate);margin:10px 0 4px;}
  .field-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-family:Arial,sans-serif;color:var(--ink);background:var(--bg);user-select:text;-webkit-user-select:text;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

  .chat-thread{display:flex;flex-direction:column;gap:10px;max-height:260px;overflow-y:auto;padding-right:4px;}
  .chat-bubble{max-width:78%;padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.45;}
  .chat-bubble.client{align-self:flex-start;background:#EEF1F1;color:var(--ink);border-bottom-left-radius:3px;}
  .chat-bubble.contractor{align-self:flex-end;background:var(--teal-tint);color:var(--teal-dark);border-bottom-right-radius:3px;}
  .chat-bubble .cb-role{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.65;margin-bottom:3px;}

  .gc-toast{
    position:fixed;bottom:24px;right:24px;max-width:360px;background:var(--ink);color:#fff;
    padding:14px 18px;border-radius:10px;font-size:12.5px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,0.25);
    opacity:0;transform:translateY(12px);transition:opacity .25s ease, transform .25s ease;pointer-events:none;z-index:100;
  }
  .gc-toast.show{opacity:1;transform:translateY(0);}

  .contact-group{margin-bottom:20px;}
  .contact-group h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);margin-bottom:8px;font-weight:700;}
  .contact-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .contact-item:last-child{border-bottom:none;}
  .dot-status{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot-status.linked{background:var(--teal);}
  .dot-status.unlinked{background:var(--slate-light);}

  .empty-module{text-align:center;padding:70px 20px;color:var(--slate);}
  .empty-module .tag{display:inline-block;background:var(--orange-tint);color:#A8590C;font-weight:700;font-size:11.5px;padding:6px 14px;border-radius:20px;margin-bottom:16px;}
  .empty-module h2{color:var(--ink);margin-bottom:8px;}
  .empty-module p{max-width:420px;margin:0 auto;font-size:13.5px;line-height:1.6;}

  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="topbar">
      <div class="searchbar"><span class="ic">⌕</span><span id="searchPlaceholder">Search in GoodCompany…</span></div>
      <button class="quickadd" id="quickAddBtn" title="Quick add">+</button>
      <div class="topbar-spacer"></div>
      <span class="badge-sim" id="simBadge">MVP 1 showmodel — simulated data</span>

function payoutAfterFee(gross){ return gross - gross*PLATFORM_FEE; }
function feeAmount(gross){ return gross*PLATFORM_FEE; }

}

  showToast(`${fmtEUR(gross)} ${t("released from escrow for")} "${m.desc}" — ${t("paid out:")} ${fmtEUR(payoutAfterFee(gross))} (${t("incl. 2% platform fee")}).`);

/* ---------- Flow #2: Warranty & Holdback — helpers ---------- */
const WARRANTY_HOLDBACK_MAP = {0:0, 15:5, 30:10, 90:15};
function holdbackSchedule(c){
  const days = c.warranty.periodDays;
  const total = c.amountValue;
  const holdbackAmount = total * c.warranty.holdbackPct/100;
  if(days===0) return { directRelease: total, holdbackAmount:0, steps: [] };
  const directRelease = total - holdbackAmount;
  let dayList;
  if(days===15) dayList = [15];
  else if(days===30) dayList = [15,30];
  else dayList = [30,60,90];
  const n = dayList.length;
  let allocated = 0;
  const steps = dayList.map((day,i)=>{
    let amt;
    if(i===n-1){ amt = holdbackAmount - allocated; }
    else { amt = Math.round(holdbackAmount/n); allocated += amt; }
    return { day, amount:amt };
  });
  return { directRelease, holdbackAmount, steps };
}

function advanceWarrantyTime(ci){
  const c = state.contracts[ci], w = c.warranty;
  if(w.status!=="active") return;
  const prevDay = w.simDay;
  w.simDay = Math.min(w.periodDays, w.simDay + 15);
  const sched = holdbackSchedule(c);
  const justReleased = sched.steps.filter(s=>s.day<=w.simDay && s.day>prevDay);
  render();
  if(justReleased.length){
    showToast(justReleased.map(s=>`${t("Day")} ${s.day}: ${fmtEUR(s.amount)} ${t("holdback released.")}`).join(" "));
  }
  if(w.simDay >= w.periodDays){ w.status = "completed"; render(); }
}
window.advanceWarrantyTime = advanceWarrantyTime;

  r.error = "";
  r.submitted = true;
  state.reviews.unshift({ stars:r.stars, text:r.text.trim(), contractTitle:c.title });
  render();
  showToast(t("Review posted — reputation score is recalculated automatically. No review committee vets this beforehand."));
}

/* ---------- Community Bank — Loan Application (4-stage flow) ---------- */
const LOAN_STAGES = ["aanvraag","onderbouwing","stemmen","uitkomst"];
const LOAN_STAGE_LABELS = {aanvraag:()=>t("Application"), onderbouwing:()=>t("Justification"), stemmen:()=>t("Sampling & voting"), uitkomst:()=>t("Outcome")};
const LOAN_CATEGORIES = ["Uitrusting","Voorraad","Transport","Software"]; // Configuration Registry §5 — never living expenses
const LOAN_CATEGORY_LABELS = {Uitrusting:()=>t("Equipment"), Voorraad:()=>t("Inventory"), Transport:()=>t("Transport"), Software:()=>t("Software")};
const LOAN_APPROVAL_THRESHOLD = 60; // Configuration Registry §1 — community_loan_approval_threshold

function openLoanApplication(){
  state.loanApplication = { stage:"aanvraag", purpose:"", amount:"", category:"Uitrusting", motivation:"", votes:0, votesFor:0, required:100, audience:300, simRounds:0 };
  state.view = "loanApplication";
  render();
}
window.openLoanApplication = openLoanApplication;

function loanCanAdvance(){
  const a = state.loanApplication;
  if(a.stage==="aanvraag") return a.purpose.trim().length>0 && Number(a.amount)>0;
  if(a.stage==="onderbouwing") return a.motivation.trim().length>0;
  if(a.stage==="stemmen") return a.simRounds>0;
  return true;
}
function loanBlockedReason(){
  const a = state.loanApplication;
  if(a.stage==="aanvraag") return t("Fill in a purpose and an amount.");
  if(a.stage==="onderbouwing") return t("Describe the justification first.");
  if(a.stage==="stemmen") return t("Simulate at least one round of voting first.");
  return "";
}
function loanNextStage(){
  if(!loanCanAdvance()){ alert(loanBlockedReason()); return; }
  const i = LOAN_STAGES.indexOf(state.loanApplication.stage);
  if(i < LOAN_STAGES.length-1){ state.loanApplication.stage = LOAN_STAGES[i+1]; render(); }
}
window.loanNextStage = loanNextStage;
function loanPrevStage(){
  const i = LOAN_STAGES.indexOf(state.loanApplication.stage);
  if(i > 0){ state.loanApplication.stage = LOAN_STAGES[i-1]; render(); }
}
window.loanPrevStage = loanPrevStage;

function updateLoanField(field, val){ state.loanApplication[field] = val; }
window.updateLoanField = updateLoanField;

function simulateLoanVoting(){
  const a = state.loanApplication;
  if(a.votes >= a.required) return; // already enough votes, simulation has no further effect
  a.votes = Math.min(a.required, a.votes + 40); // caps at required votes needed, not audience (sample size)
  a.votesFor = 72; // illustrative, deterministic outcome — no real sampling calculation needed for this showmodel
  a.simRounds += 1;
  render();
  const justResolved = a.votes >= a.required;
  showToast(justResolved
    ? `${t("Required")} ${a.required} ${t("votes reached (from a sample of")} ${a.audience}) — ${t("remaining invitations are cancelled.")} ${a.votesFor}% ${t("in favour.")}`
    : `${t("Simulating incoming votes:")} ${a.votes}/${a.required} ${t("votes collected from the sample of")} ${a.audience} ${t("members,")} ${a.votesFor}% ${t("in favour.")}`
  );
}
window.simulateLoanVoting = simulateLoanVoting;

function finalizeLoanApplication(){
  const a = state.loanApplication;
  const approved = a.votes>=a.required && a.votesFor>=LOAN_APPROVAL_THRESHOLD;
  if(approved && !a.finalized){
    state.loans.push({ purpose:a.purpose, amount:`€${Number(a.amount).toLocaleString('en-US')}`, votesFor:a.votesFor, required:a.required, votes:a.votes, audience:a.audience });
    a.finalized = true;
  }
  return approved;
}

function viewLoanApplication(){
  const a = state.loanApplication;
  const idx = LOAN_STAGES.indexOf(a.stage);
  let body = "";

  if(a.stage==="aanvraag"){
    body = `
      <label class="field-label">${t("Purpose of the loan")}</label>
      <input id="loan-purpose" class="field-input" value="${a.purpose.replace(/"/g,'&quot;')}" oninput="updateLoanField('purpose', this.value)" placeholder="${t('E.g. purchasing a compressor')}">
      <label class="field-label">${t("Amount")}</label>
      <input id="loan-amount" class="field-input" style="max-width:180px;" type="text" inputmode="numeric" pattern="[0-9]*" value="${a.amount}" oninput="updateLoanField('amount', this.value)">
      <label class="field-label">${t("Category")}</label>
      <select id="loan-category" class="field-input" onchange="updateLoanField('category', this.value)">
        ${LOAN_CATEGORIES.map(c=>`<option value="${c}" ${a.category===c?'selected':''}>${LOAN_CATEGORY_LABELS[c]()}</option>`).join("")}
      </select>
      <p style="font-size:11px;color:var(--slate-light);margin:6px 0 0;">${t("Only these four categories are allowed — never living expenses.")}</p>`;
  }
  else if(a.stage==="onderbouwing"){
    body = `
      <label class="field-label">${t("Justification — why is this needed and how does it contribute to your repayment capacity?")}</label>
      <textarea id="loan-motivation" class="field-input" rows="4" oninput="updateLoanField('motivation', this.value)">${(a.motivation||"").replace(/</g,"&lt;")}</textarea>`;
  }
  else if(a.stage==="stemmen"){
    const pct = Math.min(100, Math.round((a.votes/a.required)*100));
    const resolved = a.votes >= a.required;
    body = `
      <div class="ov-row"><div class="ov-top"><span class="lbl">${t("Votes collected")}</span><span class="val">${a.votes}/${a.required} · ${a.votesFor}% ${t("in favour")}</span></div>
      <div class="thinbar"><div style="width:${pct}%;background:var(--teal)"></div></div></div>
      <p style="font-size:11.5px;color:var(--slate);margin:10px 0 14px;">${t("Sent to a sample of")} ${a.audience} ${t("members. Approval requires at least")} ${a.required} ${t("votes cast and")} ${LOAN_APPROVAL_THRESHOLD}% ${t("in favour.")}</p>
      ${resolved
        ? `<div class="fee-note">✓ ${t("Required")} ${a.required} ${t("votes reached — remaining invitations from the sample of")} ${a.audience} ${t("have been cancelled, the vote is resolved.")}</div>`
        : `<button class="btn btn-sm" onclick="simulateLoanVoting()">${t("Simulate incoming votes")}</button>`}`;
  }
  else if(a.stage==="uitkomst"){
    const approved = finalizeLoanApplication();
    body = approved
      ? `<div class="empty-module" style="padding:30px 20px;"><span class="tag" style="background:var(--success-tint);color:var(--success);">✓ ${t("Approved")}</span><h2>${t("Loan disbursed (simulated)")}</h2><p>${a.votes}/${a.required} ${t("votes,")} ${a.votesFor}% ${t("in favour — above the required")} ${LOAN_APPROVAL_THRESHOLD}%. ${t("The application has been added to the loan list in Community Bank.")}</p></div>`
      : `<div class="empty-module" style="padding:30px 20px;"><span class="tag" style="background:var(--danger-tint);color:var(--danger);">✗ ${t("Rejected")}</span><h2>${t("Insufficient support")}</h2><p>${a.votes}/${a.required} ${t("votes,")} ${a.votesFor}% ${t("in favour — not enough for the required")} ${LOAN_APPROVAL_THRESHOLD}%.</p></div>`;
  }

  return `
  <div class="card" style="margin-bottom:16px;max-width:640px;">
    <div class="stage-tracker">
      ${LOAN_STAGES.map((s,i)=>`${i>0?'<div class="stage-connector"></div>':''}<div class="stage"><div class="node ${i<idx?'done':''} ${i===idx?'current':''}">${LOAN_STAGE_LABELS[s]()}</div></div>`).join("")}
    </div>
  </div>
  <div class="card" style="max-width:640px;">
    <div class="card-head"><div class="card-title"><span class="ic">✦</span>${LOAN_STAGE_LABELS[a.stage]()}</div></div>
    ${body}
    ${a.stage!=="uitkomst" ? `
    <div style="display:flex;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);">
      <button class="btn ghost btn-sm" onclick="loanPrevStage()" ${idx===0?'disabled':''}>← ${t("Previous")}</button>
      <button class="btn btn-sm" onclick="loanNextStage()">${t("Next")} →</button>
    </div>` : `
    <div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border);">
      <button class="btn ghost btn-sm" onclick="state.view='communitybank';render();">← ${t("Back to Community Bank")}</button>
    </div>`}
  </div>`;
}

/* ---------- Reusable pieces ---------- */
function donut(segments, size=126){
  // segments: [{value, color}]
  const total = segments.reduce((a,s)=>a+s.value,0);
  let acc = 0;
  const stops = segments.map(s=>{
    const start = (acc/total)*360; acc += s.value; const end = (acc/total)*360;
    return `${s.color} ${start}deg ${end}deg`;
  }).join(", ");
  return `<div class="donut" style="width:${size}px;height:${size}px;background:conic-gradient(${stops});"></div>`;
}
function legendFor(segments){
  return `<div class="legend">${segments.map(s=>`
    <div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${s.label} <span style="color:var(--slate-light);font-weight:500;">${s.value}%</span></div>
  `).join("")}</div>`;
}

  return `
  <div class="card kpi">
    <div class="kpi-top">
      <div class="lbl"><span class="ic" style="background:${icColor}">${icon}</span>${label}</div>
      <span class="kpi-frac">${frac}</span>
    </div>
    <div class="thinbar"><div style="width:${pct}%;background:${barColor}"></div></div>
  </div>`;
}

const stageList = ["introduction","technical_intake","terms","quote","contract_preview","closed"];
const stageLabels = {introduction:()=>t("Introduction"), technical_intake:()=>t("Technical intake"), terms:()=>t("Terms"), quote:()=>t("Quote"), contract_preview:()=>t("Contract preview"), closed:()=>t("Completed")};

function activeIntakeQuestions(d){
  return d.questionLibrary.filter(x=>x.selected).map(x=>x.q).concat(d.customQuestions);
}
function toggleLibraryQuestion(i){ state.wsDetail.questionLibrary[i].selected = !state.wsDetail.questionLibrary[i].selected; render(); }
window.toggleLibraryQuestion = toggleLibraryQuestion;
function updateCustomQuestionDraft(val){ state.wsDetail.customQuestionDraft = val; }
window.updateCustomQuestionDraft = updateCustomQuestionDraft;
function addCustomQuestion(){
  const d = state.wsDetail;
  const q = (d.customQuestionDraft||"").trim();
  if(!q) return;
  d.customQuestions.push(q);
  d.customQuestionDraft = "";
  render();
}
window.addCustomQuestion = addCustomQuestion;
function removeCustomQuestion(i){ state.wsDetail.customQuestions.splice(i,1); render(); }
window.removeCustomQuestion = removeCustomQuestion;
function updateIntakeAnswer(q, val){ state.wsDetail.intakeAnswers[q] = val; }
window.updateIntakeAnswer = updateIntakeAnswer;

function canAdvance(){
  const s = state.workspaceStage, d = state.wsDetail;
  if(s==="technical_intake"){
    const qs = activeIntakeQuestions(d);
    return qs.length>0 && qs.every(q=>(d.intakeAnswers[q]||"").trim().length>0);
  }
  if(s==="terms"){
    const sum = d.terms.phases.reduce((a,p)=>a+Number(p.pct||0),0);
    return d.termsAccepted && sum===100;
  }
  if(s==="quote") return d.quoteSubmitted && d.quoteAccepted;
  if(s==="contract_preview") return d.signatures.client && d.signatures.contractor;
  return true;
}
function blockedReason(){
  const s = state.workspaceStage, d = state.wsDetail;
  if(s==="technical_intake"){
    const qs = activeIntakeQuestions(d);
    if(qs.length===0) return t("Select at least one question (or add your own) before continuing.");
    return t("Answer all selected intake questions first.");
  }
  if(s==="terms"){
    const sum = d.terms.phases.reduce((a,p)=>a+Number(p.pct||0),0);
    if(sum!==100) return `${t("Payment phases must add up to 100% (currently")} ${sum}%).`;
    if(!d.termsAccepted) return t("Accept the terms first.");
  }
  if(s==="quote") return t("Quote must be submitted and accepted.");
  if(s==="contract_preview") return t("Both parties must sign.");
  return "";
}
function nextStage(){
  if(!canAdvance()){ alert(blockedReason()); return; }
  const i = stageList.indexOf(state.workspaceStage);
  if(i < stageList.length-1){ state.workspaceStage = stageList[i+1]; render(); }
}
function prevStage(){
  const i = stageList.indexOf(state.workspaceStage);
  if(i > 0){ state.workspaceStage = stageList[i-1]; render(); }
}
window.nextStage = nextStage; window.prevStage = prevStage;

function viewContractDetail(){
  const c = state.contracts[state.contractDetailIndex];
  if(!c) return `<p>${t("Contract not found.")}</p>`;
  const ci = state.contractDetailIndex;
  const stageList = ["introduction","technical_intake","terms","quote","contract_preview","closed"];
  const stageLabels = {introduction:t("Introduction"), technical_intake:t("Technical intake"), terms:t("Terms"), quote:t("Quote"), contract_preview:t("Contract preview"), closed:t("Completed")};
  const d = state.wsDetail; // reuse the same sample negotiation content for this demo contract
  const closedDone = c.status === "completed";

  const tabs = [ {id:"overview", label:t("Overview")}, {id:"escrow", label:t("Escrow & Milestones")} ];
  if(c.warranty.status !== "not_started"){ tabs.push({id:"warranty", label:t("Warranty")}); }
  const activeTab = tabs.some(tb=>tb.id===state.contractDetailTab) ? state.contractDetailTab : "overview";

  let tabBody = "";
  if(activeTab==="overview") tabBody = renderOverviewTab(c, d, closedDone);
  else if(activeTab==="escrow") tabBody = renderEscrowTab(c, ci);
  else if(activeTab==="warranty") tabBody = renderWarrantyTab(c, ci);

  return `
  <div class="card" style="margin-bottom:16px;">
    <div class="card-head"><div class="card-title"><span class="ic">◈</span>${c.title}</div><span class="pill ${c.status}">${t(c.status)}</span></div>
    <div class="stage-tracker">
      ${stageList.map((s,i)=>{ const done = s==="closed" ? closedDone : true; return `${i>0?'<div class="stage-connector"></div>':''}<div class="stage"><div class="node ${done?'done':''}">${stageLabels[s]}</div></div>`; }).join("")}
    </div>
  </div>
  <div class="tabs">
    ${tabs.map(tb=>`<button class="tab ${activeTab===tb.id?'active':''}" onclick="switchContractTab('${tb.id}')">${tb.label}</button>`).join("")}
  </div>
  ${tabBody}
  <button class="btn ghost btn-sm" style="margin-top:16px;" onclick="state.view='goodtrade';render();">← ${t("Back to GoodTrade")}</button>`;
}

      <div class="ov-row"><div class="ov-top"><span class="lbl">${t("Amount")}</span><span class="val">${c.amount}</span></div></div>
      <div class="ov-row"><div class="ov-top"><span class="lbl">${t("Escrow status")}</span><span class="val">${t(c.escrow)}</span></div></div>
      <div class="ov-row"><div class="ov-top"><span class="lbl">${t("Working hours")}</span><span class="val">${d.terms.workingHours||"—"}</span></div></div>
      <div class="ov-row"><div class="ov-top"><span class="lbl">${t("Warranty")}</span><span class="val">${c.warranty.periodDays===0?t('None'):c.warranty.periodDays+' '+t('days')+' ('+c.warranty.holdbackPct+'% '+t('holdback')+')'}</span></div></div>
      <div class="ov-row"><div class="ov-top"><span class="lbl">${t("Signed by")}</span><span class="val">${closedDone?t('Both parties')+' ✓':t('Not yet both parties')}</span></div></div>

function renderChangeOrderCard(ci, co, coi){
  const rejectOpen = state.activeCoRejectBox === (ci+"|"+coi);
  let html = `<div class="milestone-card">
    <div class="milestone-head"><div><div class="milestone-title">${co.desc}</div><div class="milestone-sub">+${fmtEUR(co.amount)}</div></div><span class="pill ${co.status}">${t(co.status)}</span></div>
    <div class="reject-box" style="margin-top:10px;">
      <div class="field-label" style="margin-top:0;">${t("Motivation (submitter)")}</div>
      <p style="font-size:12.5px;margin:0;">${co.motivation}</p>
    </div>`;

  if(co.status==="proposed"){
    html += `<div style="margin-top:10px;">
      <label class="field-label" style="margin-top:0;">${t("Note on acceptance (optional)")}</label>
      <textarea id="co-approval-${ci}-${coi}" class="field-input" rows="2" oninput="updateApprovalDraft(${ci},${coi},this.value)">${(co._approvalDraft||"").replace(/</g,"&lt;")}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-sm" onclick="acceptChangeOrder(${ci},${coi})">${t("Accept (client)")}</button>
        <button class="btn ghost btn-sm" onclick="toggleCoRejectBox(${ci},${coi})">${t("Reject")}</button>
      </div>
      ${rejectOpen ? `<div class="reject-box">
        <label class="field-label">${t("Reason for rejection (required)")}</label>
        <textarea id="co-reject-${ci}-${coi}" class="field-input" rows="2" oninput="updateCoRejectDraft(${ci},${coi},this.value)">${(co._rejectDraft||"").replace(/</g,"&lt;")}</textarea>
        <button class="btn btn-sm" style="margin-top:8px;" onclick="rejectChangeOrder(${ci},${coi})">${t("Confirm rejection")}</button>
      </div>` : ""}
    </div>`;
  }
  else if(co.status==="accepted"){
    html += `<div class="reject-box" style="margin-top:10px;">
      <div class="field-label" style="margin-top:0;">${t("Response (client)")}</div>
      <p style="font-size:12.5px;margin:0;">✓ ${t("Accepted")}${co.approvalNote ? ': '+co.approvalNote : '.'}</p>
    </div>`;
    if(co.funded){
      html += `<p class="fee-note">${t("Withdrawal after funding goes through the dispute procedure (see Warranty tab/mediator mechanism), not a simple status change.")}</p>`;
    } else if(co.withdrawalStatus==="requested"){
      html += `<div class="fee-note">${t("Awaiting confirmation from the other party.")}</div>
      <button class="btn ghost btn-sm" style="margin-top:8px;" onclick="confirmWithdrawChangeOrder(${ci},${coi})">${t("Confirm withdrawal on behalf of other party — simulated")}</button>`;
    } else {
      html += `<button class="btn ghost btn-sm" style="margin-top:8px;" onclick="requestWithdrawChangeOrder(${ci},${coi})">${t("Withdraw (mutual consent)")}</button>`;
    }
  }
  else if(co.status==="rejected"){
    html += `<div class="reject-box" style="margin-top:10px;">
      <div class="field-label" style="margin-top:0;">${t("Response (client)")}</div>
      <p style="font-size:12.5px;margin:0;">✗ ${t("Rejected")}: ${co.rejectionReason}</p>
    </div>`;
  }
  else if(co.status==="withdrawn"){
    html += `<div class="fee-note">${t("Withdrawn with mutual consent (simulated) — both parties agreed.")}</div>`;
  }

  html += `</div>`;
  return html;
}

function renderEscrowTab(c, ci){
  const routeLabel = c.paymentRoute==="phased" ? t("Phased") : t("Lump sum");
  let html = `
  <div class="card" style="margin-bottom:16px;">
    <div class="card-head"><div class="card-title"><span class="ic">◈</span>${t("Payment route")}</div><span class="pill ${c.paymentRoute==='phased'?'active':'funded'}">${routeLabel}</span></div>`;
  if(c.paymentRoute==="phased"){
    const sum = contractPhaseSum(c);
    html += `<p style="font-size:11.5px;color:var(--slate);margin:0 0 10px;">${t("Phase amounts add up to")} <strong style="color:${sum===100?'var(--success)':'var(--danger)'}">${sum}%</strong> ${t("of the quote amount")} (${c.amount}).</p>`;
    c.milestones.forEach(m=>{
      html += `<div class="ov-row"><div class="ov-top"><span class="lbl">${m.desc}</span><span class="val">${m.pct}% · ${fmtEUR(milestoneAmount(c,m))}</span></div></div>`;
    });
  } else {
    html += `<p style="font-size:11.5px;color:var(--slate);margin:0;">${t("The full amount")} (${c.amount}) ${t("is released in one go after the final evaluation is signed by both parties.")}</p>`;
  }
  html += `</div>`;

  if(c.paymentRoute==="phased"){
    html += `<div class="card-title" style="font-size:13px;margin-bottom:10px;"><span class="ic">▤</span>${t("Milestones")}</div>`;
    c.milestones.forEach((m,mi)=>{
      const key = ci+"|"+mi;
      const rejectOpen = state.activeRejectBox === key;
      html += `<div class="milestone-card st-${m.status}">
        <div class="milestone-head">
          <div><div class="milestone-title">${m.desc}</div><div class="milestone-sub">${m.pct}% · ${fmtEUR(milestoneAmount(c,m))}</div></div>
          <span class="pill ${m.status}">${t(m.status)}</span>
        </div>`;
      if(m.status==="pending"){
        html += `<div style="margin-top:10px;"><button class="btn btn-sm" onclick="submitMilestone(${ci},${mi})">${t("Submit milestone (contractor)")}</button></div>`;
      } else if(m.status==="submitted" && m.payoutPending){
        html += `<div class="fee-note">⏳ ${t("Payout pending — awaiting provider confirmation (asynchronous, never rely on a synchronous response alone).")}</div>
        <div style="margin-top:8px;"><button class="btn btn-sm" onclick="finalizeMilestonePayout(${ci},${mi})">${t("Simulate provider webhook")}</button></div>`;
      } else if(m.status==="submitted"){
        html += `<div style="margin-top:10px;display:flex;gap:8px;">
          <button class="btn btn-sm" onclick="requestApproveMilestone(${ci},${mi})">${t("Approve (client)")}</button>
          <button class="btn ghost btn-sm" onclick="toggleRejectBox(${ci},${mi})">${t("Reject")}</button>
        </div>`;
        if(rejectOpen){
          html += `<div class="reject-box">
            <label class="field-label">${t("Reason for rejection (required)")}</label>
            <textarea id="reject-${ci}-${mi}" class="field-input" rows="2" oninput="updateRejectDraft(${ci},${mi},this.value)">${(m._rejectDraft||"").replace(/</g,"&lt;")}</textarea>
            <button class="btn btn-sm" style="margin-top:8px;" onclick="confirmReject(${ci},${mi})">${t("Confirm rejection")}</button>
          </div>`;
        }
      } else if(m.status==="rejected"){
        html += `<div class="reject-box"><div class="field-label" style="margin-top:0;">${t("Explanation")}</div><p style="font-size:12.5px;margin:0;">${m.rejectReason}</p>
          <button class="btn ghost btn-sm" style="margin-top:8px;" onclick="resubmitMilestone(${ci},${mi})">${t("Resubmit (contractor)")}</button></div>`;
      } else if(m.status==="paid"){
        const gross = milestoneAmount(c,m);
        html += `<div class="fee-note">${t("Amount paid out:")} ${fmtEUR(payoutAfterFee(gross))} (${t("incl. 2% platform fee, deducted at payout — not at funding.")})</div>`;
      }
      html += `</div>`;
    });
  }

  const coBlocked = c.warranty.status !== "not_started";
  html += `<div class="card" style="margin-top:16px;">
    <div class="card-head"><div class="card-title"><span class="ic">✎</span>${t("Change Orders")}</div>
      ${coBlocked ? `<span class="pill closed">${t("No longer possible — warranty phase started")}</span>` : `<button class="btn ghost btn-sm" onclick="toggleChangeOrderForm()">+ ${t("Propose extra work")}</button>`}
    </div>`;
  if(state.changeOrderForm.open && !coBlocked){
    html += `<div style="margin-bottom:14px;">
      <label class="field-label">${t("Description")}</label>
      <input id="co-desc" class="field-input" value="${state.changeOrderForm.desc.replace(/"/g,'&quot;')}" oninput="updateChangeOrderField('desc', this.value)" placeholder="${t('E.g. add extra pages to the website')}">
      <label class="field-label">${t("Amount (extra work)")}</label>
      <input id="co-amount" class="field-input" style="max-width:160px;" type="text" inputmode="numeric" pattern="[0-9]*" value="${state.changeOrderForm.amount}" oninput="updateChangeOrderField('amount', this.value)">
      <label class="field-label">${t("Motivation (required)")}</label>
      <textarea id="co-motivation" class="field-input" rows="2" oninput="updateChangeOrderField('motivation', this.value)">${(state.changeOrderForm.motivation||"").replace(/</g,"&lt;")}</textarea>
      <button class="btn btn-sm" style="margin-top:10px;" onclick="submitChangeOrder(${ci})">${t("Submit (read confirmation as submitter)")}</button>
      <div class="fee-note">${t("This proposal automatically expires if the other party doesn't respond within a period equal to the original job's delivery timeframe, with a fallback maximum of 90 days.")}</div>
    </div>`;
  }
  if(c.changeOrders.length===0 && !state.changeOrderForm.open){
    html += `<p style="font-size:12px;color:var(--slate);margin:0;">${t("No change order proposals.")}</p>`;
  }
  c.changeOrders.forEach((co,coi)=>{ html += renderChangeOrderCard(ci, co, coi); });
  html += `</div>`;

  const paidGate = allMilestonesPaid(c);
  html += `<div class="card" style="margin-top:16px;">
    <div class="card-title" style="font-size:13px;margin-bottom:10px;"><span class="ic">✓</span>${t("Final Evaluation")}</div>`;
  if(!paidGate){
    html += `<p style="font-size:12px;color:var(--slate);margin:0;">${t("All milestones must be paid out before the final evaluation can be signed.")}</p>`;
  } else if(c.finalEvaluation.invoiceGenerated){
    html += `<span class="pill completed">✓ ${t("Completed — invoice automatically generated")}</span>`;
    html += renderReviewWidget(c, ci);
  } else {
    html += `<div style="display:flex;gap:8px;">
      ${c.finalEvaluation.contractorSigned ? `<span class="pill completed">✓ ${t("Contractor signed")}</span>` : `<button class="btn btn-sm" onclick="signFinalEvaluation(${ci},'contractor')">${t("Sign (contractor)")}</button>`}
      ${c.finalEvaluation.clientSigned ? `<span class="pill completed">✓ ${t("Client signed")}</span>` : `<button class="btn btn-sm" onclick="signFinalEvaluation(${ci},'client')">${t("Sign (client)")}</button>`}
    </div>`;
  }
  html += `</div>`;
  return html;
}

function renderWarrantyTab(c, ci){
  const w = c.warranty;
  const sched = holdbackSchedule(c);
  let html = `<div class="card" style="margin-bottom:16px;">
    <div class="card-head"><div class="card-title"><span class="ic">◈</span>${t("Warranty & Holdback")}</div><span class="pill ${w.status==='frozen'||w.status==='claimed'?'frozen':w.status==='completed'?'completed':'active'}">${t(w.status)}</span></div>
    <div class="ov-row"><div class="ov-top"><span class="lbl">${t("Warranty period")}</span><span class="val">${w.periodDays} ${t("days")}</span></div></div>
    <div class="ov-row"><div class="ov-top"><span class="lbl">${t("Holdback percentage")}</span><span class="val">${w.holdbackPct}%</span></div></div>
    <div class="ov-row"><div class="ov-top"><span class="lbl">${t("Released immediately at Completion")}</span><span class="val">${fmtEUR(sched.directRelease)}</span></div></div>
  </div>`;

  if(w.periodDays===0){
    html += `<p style="font-size:12.5px;color:var(--slate);">${t("No warranty period agreed — this contract has no holdback module.")}</p>`;
    return html;
  }

  html += `<div class="card" style="margin-bottom:16px;">
    <div class="card-title" style="font-size:13px;margin-bottom:4px;">${t("Holdback timeline")}</div>
    <div class="hb-timeline">
      <div class="hb-step done"><div class="hb-dot"></div><div class="hb-lbl">${t("Completion")}</div><div class="hb-amt">${fmtEUR(sched.directRelease)}</div><div class="hb-status done">${t("Released")}</div></div>
      ${sched.steps.map(s=>{
        const released = s.day <= w.simDay;
        const frozen = (w.status==="frozen"||w.status==="claimed") && !released;
        const cls = released ? "done" : frozen ? "frozen" : "";
        const label = released ? t("Released") : frozen ? t("Frozen") : t("Scheduled");
        return `<div class="hb-step ${cls}"><div class="hb-dot"></div><div class="hb-lbl">${t("Day")} ${s.day}</div><div class="hb-amt">${fmtEUR(s.amount)}</div><div class="hb-status ${cls||'pending'}">${label}</div></div>`;
      }).join("")}
    </div>`;
  if(w.status==="active"){
    html += `<div style="margin-top:10px;"><button class="btn btn-sm" onclick="advanceWarrantyTime(${ci})">${t("Simulate time passing (+15 days)")}</button>
      <span style="font-size:11.5px;color:var(--slate);margin-left:10px;">${t("Current day:")} ${w.simDay} / ${w.periodDays}</span></div>`;
  }
  html += `</div>`;

  html += `<div class="card">
    <div class="card-title" style="font-size:13px;margin-bottom:8px;">${t("Claim / dispute")}</div>`;
  if(w.status==="frozen" || w.status==="claimed"){
    html += `<p style="font-size:12.5px;"><strong>${t("Reported:")}</strong> ${w.claim.description}</p>
      <p style="font-size:11.5px;color:var(--slate);">${t("Dispute reported → ticket created outside the platform. Remaining holdback frozen; already paid-out portions remain final.")}</p>`;
  } else if(w.status==="active"){
    html += `<button class="btn ghost btn-sm" onclick="toggleClaimForm()">${t("Report claim/dispute")}</button>`;
    if(state.claimForm.open){
      html += `<div class="reject-box">
        <label class="field-label">${t("Describe the problem")}</label>
        <textarea id="claimText" class="field-input" rows="3" oninput="updateClaimDraft(this.value)">${(state.claimForm.text||"").replace(/</g,"&lt;")}</textarea>
        <button class="btn btn-sm" style="margin-top:8px;" onclick="submitClaim(${ci})">${t("Submit claim")}</button>
      </div>`;
    }
  } else {
    html += `<p style="font-size:12.5px;color:var(--slate);margin:0;">${t("Warranty period fully elapsed without a claim.")}</p>`;
  }
  html += `</div>`;
  return html;
}

function t(s){
  if(state.lang === "nl"){
    return NL[s] !== undefined ? NL[s] : s;
  }
  return s;
}
function toggleLang(){
  state.lang = state.lang === "en" ? "nl" : "en";
  applyStaticI18n();
  render();
}
window.toggleLang = toggleLang;
function applyStaticI18n(){
  const isNl = state.lang === "nl";
  const btn = document.getElementById("langToggleBtn");
  if(btn) btn.textContent = isNl ? "🇳🇱 NL" : "🇬🇧 EN";
  const staticMap = [
    ["searchPlaceholder", isNl ? "Zoeken in GoodCompany…" : "Search in GoodCompany…"],
    ["quickAddBtn", isNl ? "Snel toevoegen" : "Quick add", "title"],
    ["simBadge", isNl ? "MVP 1 showmodel — gesimuleerde data" : "MVP 1 showmodel — simulated data"],
    ["jobModalTitle", isNl ? "Nieuwe job plaatsen" : "Post a new job"],
    ["jmLabelTitle", isNl ? "Titel" : "Title"],
    ["jmLabelRegion", isNl ? "Regio" : "Region"],
    ["jmLabelPriority", isNl ? "Urgentie" : "Urgency"],
    ["jmLabelBudget", isNl ? "Indicatief budget (optioneel — nooit publiek zichtbaar op de listing, alleen ter referentie voor jezelf totdat je het zelf inbrengt in een onderhandeling)" : "Indicative budget (optional — never publicly visible on the listing, only for your own reference until you bring it up yourself in a negotiation)"],
    ["jmCancelBtn", isNl ? "Annuleren" : "Cancel"],
    ["jmSubmitBtn", isNl ? "Job plaatsen" : "Post job"],
    ["contactModalTitle", isNl ? "Nieuw contact toevoegen" : "Add a new contact"],
    ["cmLabelName", isNl ? "Naam" : "Name"],
    ["cmLabelPhone", isNl ? "Telefoonnummer" : "Phone number"],
    ["cmLabelEmail", isNl ? "E-mailadres" : "Email address"],
    ["cmLabelGroup", isNl ? "Groep" : "Group"],
    ["cmLabelChannel", isNl ? "Uitnodigingskanaal (indien nog geen GC-account)" : "Invitation channel (if no GC account yet)"],
    ["cmCancelBtn", isNl ? "Annuleren" : "Cancel"],
    ["cmSubmitBtn", isNl ? "Contact toevoegen" : "Add contact"],
    ["groupModalTitle", isNl ? "Nieuwe groep aanmaken" : "Create new group"],
    ["gmLabelName", isNl ? "Groepsnaam" : "Group name"],
    ["gmCancelBtn", isNl ? "Annuleren" : "Cancel"],
    ["gmSubmitBtn", isNl ? "Groep aanmaken" : "Create group"],
    ["stepUpTitle", isNl ? "Bevestig deze actie opnieuw" : "Please reconfirm this action"],
    ["stepUpBody", isNl ? "Elke actie die geld verplaatst vereist directe herauthenticatie, ook binnen een actieve sessie." : "Any action that moves money requires direct re-authentication, even within an active session."],
    ["stepUpCancelBtn", isNl ? "Annuleren" : "Cancel"],
    ["stepUpConfirmBtn", isNl ? "Bevestigen" : "Confirm"],
  ];
  staticMap.forEach(([id, text, attr])=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(attr==="title") el.title = text;
    else el.textContent = text;
  });
  // Placeholder texts (input placeholders don't have easy IDs for all, handle key ones)
  const jmTitle = document.getElementById("jm-title"); if(jmTitle) jmTitle.placeholder = isNl ? "Bijv. Website herbouwen in Vue/Nuxt" : "E.g. Rebuild website in Vue/Nuxt";
  const jmRegion = document.getElementById("jm-region"); if(jmRegion) jmRegion.placeholder = isNl ? "Bijv. Nijmegen of Remote" : "E.g. Nijmegen or Remote";
  const jmBudget = document.getElementById("jm-budget"); if(jmBudget) jmBudget.placeholder = isNl ? "Bijv. €2.500 — mag leeg blijven" : "E.g. €2,500 — may be left empty";
  const cmName = document.getElementById("cm-name"); if(cmName) cmName.placeholder = isNl ? "Bijv. Piet Bakker" : "E.g. Piet Bakker";
  const cmPhone = document.getElementById("cm-phone"); if(cmPhone) cmPhone.placeholder = isNl ? "Optioneel" : "Optional";
  const cmEmail = document.getElementById("cm-email"); if(cmEmail) cmEmail.placeholder = isNl ? "Optioneel" : "Optional";
  const gmName = document.getElementById("gm-name"); if(gmName) gmName.placeholder = isNl ? "Bijv. Leveranciers chemie" : "E.g. Chemical suppliers";
  // priority select options
  const jmPriority = document.getElementById("jm-priority");
  if(jmPriority){
    const opts = jmPriority.querySelectorAll("option");
    if(opts[0]) opts[0].textContent = isNl ? "Laag" : "Low";
    if(opts[1]) opts[1].textContent = isNl ? "Middel" : "Medium";
    if(opts[2]) opts[2].textContent = isNl ? "Hoog" : "High";
  }
  const cmChannel = document.getElementById("cm-channel");
  if(cmChannel){
    const opts = cmChannel.querySelectorAll("option");
    if(opts[0]) opts[0].textContent = isNl ? "E-mail" : "Email";
    if(opts[1]) opts[1].textContent = isNl ? "WhatsApp (gesimuleerd — nog niet geïntegreerd)" : "WhatsApp (simulated — not yet integrated)";
  }
}


function render(){
  const active = document.activeElement;
  let activeId = null, selStart = null, selEnd = null;
  if(active && active.id && (active.tagName==="INPUT" || active.tagName==="TEXTAREA")){
    activeId = active.id;
    try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(e){}
  }
  renderSidebar();
  renderContent();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}
applyStaticI18n();
render();
</script>
